name: Release

# push 一个 v* tag 就自动发版，并把对应的 fpk 附到 Release 上。
# 也可以在 Actions 页面手动触发（Run workflow），填一个已存在的 tag。
#
# 用仓库内置的 github.token，不需要任何人提供 PAT。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布为 Release 的已有 tag（如 v1.0.8）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          echo "发布 tag: $TAG"

          VER="${TAG#v}"
          ASSETS=()
          for f in "dist/fnos-emby-bridge-${VER}.fpk" "dist/fnos-emby-bridge.fpk"; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::dist/ 下没有找到可附加的 fpk"
            exit 1
          fi
          echo "附加文件: ${ASSETS[*]}"

          # 已存在同名 Release 时改为上传/覆盖附件
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              "${ASSETS[@]}"
          fi

          gh release view "$TAG" --json url,assets \
            --jq '"Release: \(.url)\n附件: \([.assets[].name] | join(", "))"'
