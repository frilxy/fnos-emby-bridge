name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 校验与测试
        run: |
          go vet ./...
          go test ./...

      - name: 构建 fpk
        run: ./build.sh

      - name: 上传 fpk 产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-emby-bridge-fpk
          path: dist/*.fpk
          if-no-files-found: error
          retention-days: 30
