services:
  fnos-emby-bridge:
    image: ghcr.io/ssabv/fnos-emby-bridge:latest
    container_name: fnos-emby-bridge
    restart: unless-stopped
    ports:
      # 桥接对 Emby 客户端暴露的端口（Emby 客户端连这里）
      - "8096:8096"
    environment:
      # 连接和媒体库都可在后台填
      PORT: "8096"
      ADMIN_USER: "admin"
      # 必填：留空程序会拒绝启动（不再有内置的弱默认密码）
      ADMIN_PASS: "换成你自己的强密码"
      CONFIG_PATH: "/data/bridge-config.json"
    volumes:
      - ./data:/data
    # 用 host 网络可省掉 HOST 配置（自动用本机 IP），但 Docker 网络隔离会更松
    # network_mode: host
